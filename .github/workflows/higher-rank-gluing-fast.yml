name: Higher-rank gluing fast check

on:
  push:
    branches: ["higher-rank-gluing-experiment"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMMUTABLE_PALOMAR_PARENT: abced491e10f618400e1c9739d2d9503477da76f

jobs:
  higher-rank-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard immutable Palomar Challenge
        run: git diff --exit-code "$IMMUTABLE_PALOMAR_PARENT" -- Challenge.lean

      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Check higher-rank dependency cone
        run: lake build Rank3KUM.BalancedWindowGeneral

      - name: Ensure dependency pins were not rewritten
        run: git diff --exit-code -- lake-manifest.json lean-toolchain
