name: Higher-rank gluing fast check

on:
  push:
    branches: ["higher-rank-gluing-experiment"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMMUTABLE_PALOMAR_PARENT: abced491e10f618400e1c9739d2d9503477da76f

jobs:
  higher-rank-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard immutable Palomar Challenge
        run: git diff --exit-code "$IMMUTABLE_PALOMAR_PARENT" -- Challenge.lean

      - name: Restore pinned Lean toolchain and dependencies
        id: lean-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: ${{ runner.os }}-rank3kum-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Install Elan on cache miss
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y

      - name: Add Elan to path
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download Mathlib cache on cache miss
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: lake exe cache get

      - name: Save pinned Lean toolchain and dependencies
        if: steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: ${{ runner.os }}-rank3kum-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Check higher-rank dependency cone
        run: lake build Rank3KUM.HigherRankTightCorollaries

      - name: Ensure dependency pins were not rewritten
        run: git diff --exit-code -- lake-manifest.json lean-toolchain
