name: CI

on:
  push:
    branches: ["main", "lean-integration", "version-2", "palomar"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check paper alignment tooling
        run: |
          python3 -m py_compile tools/update_v2_paper_alignment.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("tools/update_v2_paper_alignment.py")
          spec = importlib.util.spec_from_file_location("v2_paper_alignment", path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          row = "<tr><td>Lem. 5.1</td><td>x</td><td>y</td></tr>"
          try:
              module.replace_row(row + row, "Lem. 5.1", "new", "status")
          except RuntimeError as exc:
              assert "found 2" in str(exc)
          else:
              raise AssertionError("duplicate Appendix rows were not rejected")
          PY
      - name: Cache Lake packages
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}
      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify Lean toolchain
        run: |
          lean --version
          lake --version
      - name: Resolve pinned dependencies
        run: lake update
      - name: Download Mathlib cache
        run: lake exe cache get
      - name: Build Rank3KUM and Palomar targets
        run: lake build
      - name: Check Palomar statement and solution modules directly
        run: |
          lake env lean Challenge.lean
          lake env lean Solution.lean

  palomar-preflight:
    if: github.ref == 'refs/heads/palomar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current Palomar verifier
        run: |
          git clone --filter=blob:none https://github.com/PalomarRegistry/PalomarSubmission.git "$RUNNER_TEMP/palomar-pipeline"
          git -C "$RUNNER_TEMP/palomar-pipeline" checkout ef2fa1eadcb246c2346ddba39b52eaa53d4bb763
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
          working-directory: ${{ runner.temp }}/palomar-pipeline
      - name: Install Palomar verifier dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps -r "$RUNNER_TEMP/palomar-pipeline/requirements.txt"
      - name: Run production preflight preparation
        id: preflight
        env:
          BUNDLE_GEMFILE: ${{ runner.temp }}/palomar-pipeline/Gemfile
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          event = {
              "inputs": {
                  "repository": os.environ["CANDIDATE_REPOSITORY"],
                  "commit": os.environ["CANDIDATE_COMMIT"],
                  "request_id": "kumprefl0001",
                  "mode": "preflight",
                  "options": json.dumps({
                      "comparator_config_path": "comparator.json",
                      "authorization_relationship": "I am a responsible author or maintainer",
                  }),
              }
          }
          pathlib.Path(os.environ["RUNNER_TEMP"], "palomar-preflight-event.json").write_text(
              json.dumps(event), encoding="utf-8"
          )
          PY
          python "$RUNNER_TEMP/palomar-pipeline/scripts/verify_submission.py" prepare \
            --event "$RUNNER_TEMP/palomar-preflight-event.json" \
            --work-dir "$RUNNER_TEMP/palomar-work" \
            --output "$RUNNER_TEMP/palomar-preflight-report.json" \
            --licensee "$(command -v bundle)"
      - name: Require Palomar preflight readiness
        env:
          PREFLIGHT_READY: ${{ steps.preflight.outputs.ready }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          report = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "palomar-preflight-report.json").read_text())
          if os.environ.get("PREFLIGHT_READY") != "true" or report.get("status") != "pending":
              print(json.dumps(report, indent=2))
              raise SystemExit("Palomar preflight did not mark this commit ready for full verification")
          if report.get("errors"):
              print(json.dumps(report, indent=2))
              raise SystemExit("Palomar preflight reported errors")
          print("Palomar production preflight preparation passed.")
          print(json.dumps({
              "status": report.get("status"),
              "stage": report.get("stage"),
              "warnings": report.get("warnings", []),
          }, indent=2))
          PY

  palomar-comparator:
    if: github.ref == 'refs/heads/palomar'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache: false
      - name: Verify Comparator prerequisites
        run: |
          lean --version
          lake --version
          go version
          cargo --version
      - name: Run pinned Comparator and NanoDa replay
        run: bash scripts/verify-palomar-comparator.sh
