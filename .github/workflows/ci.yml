name: CI

on:
  push:
    branches: ["main", "lean-integration"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Resolve pinned dependencies
        run: lake update
      - name: Download Mathlib cache
        run: lake exe cache get
      - name: Build Rank3KUM
        run: lake build
