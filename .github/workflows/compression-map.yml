name: Compression exploration

on:
  push:
    branches: ["compression-exploration"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanical-map:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard frozen Palomar Challenge
        run: |
          git fetch origin palomar --depth=1
          git diff --exit-code origin/palomar -- Challenge.lean
          echo "Challenge.lean is unchanged from the validated palomar branch."

      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build substantive proof and Palomar wrapper
        run: lake build

      - name: Check frozen statement and proved solution directly
        run: |
          lake env lean Challenge.lean
          lake env lean Solution.lean

      - name: Extract mechanical declaration graph
        run: lake env lean tools/DependencyMap.lean

      - name: Compute deterministic theorem-specific map
        run: python3 tools/analyze_dependency_map.py

      - name: Upload mechanical baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rank3kum-mechanical-proof-map
          path: artifacts/compression/
          if-no-files-found: error
          retention-days: 90

  comparator-drift-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Guard frozen Palomar Challenge
        run: |
          git fetch origin palomar --depth=1
          git diff --exit-code origin/palomar -- Challenge.lean
      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache: false
      - name: Run Palomar-pinned Comparator and NanoDa replay
        run: bash scripts/verify-palomar-comparator.sh
