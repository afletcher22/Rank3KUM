# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Rank3KUM"
  description: >-
    Lean 4 formalization of the divisible rank-three case of the
    Kajitani-Ueno-Miyano cyclic basis ordering conjecture. It proves that every
    finite uniformly dense rank-three matroid on 3k elements, for k > 0,
    admits a cyclic ordering in which every three cyclically consecutive
    elements form a basis.
  authors:
    - "Austen Fletcher"
  license: "MIT"
  responsible_maintainers:
    - "Austen Fletcher"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05B35", "68V20"]

sources:
  - title: "The divisible rank-three case of the Kajitani-Ueno-Miyano cyclic basis ordering conjecture"
    authors:
      - "Austen Fletcher"
    type: "original-proof"
    relationship: "other"
    note: >-
      The mathematical result, Lean formalization, and accompanying manuscript
      were developed together. The version-1 paper and version-1 formalization
      were prepared and released essentially simultaneously; this entry records
      the formal development as one of the original presentations of the result.
    author_endorsement: "participated"

  - title: "Cyclic basis orderings of uniformly dense rank-three matroids"
    authors:
      - "Austen Fletcher"
    id: "10.5281/zenodo.22698709"
    type: "paper"
    location: "Theorem 1.2"
    relationship: "other"
    note: >-
      Published manuscript co-developed with the Lean proof. The Palomar
      headline theorem corresponds to Theorem 1.2. The paper's Corollary 1.3
      additionally invokes the external coprime-cardinality theorem and is not
      itself selected as a fully formalized result.
    author_endorsement: "participated"

  - title: "Ordering of the elements of a matroid such that its consecutive w elements are independent"
    authors:
      - "Y. Kajitani"
      - "S. Ueno"
      - "H. Miyano"
    id: "Discrete Mathematics 72 (1988), 187-194"
    type: "article"
    relationship: "background"
    note: >-
      Original source of the Kajitani-Ueno-Miyano cyclic-ordering conjecture.
    author_endorsement: "n/a"

  - title: "Cyclic orderings and cyclic arboricity of matroids"
    authors:
      - "Jan van den Heuvel"
      - "Stéphan Thomassé"
    id: "arXiv:0912.2929"
    type: "article"
    location: "J. Combin. Theory Ser. B 102 (2012), 638-646"
    relationship: "background"
    note: >-
      Proves the coprime-cardinality case. Together with the divisible
      rank-three theorem it implies the paper's full rank-three corollary, but
      the coprime theorem is not formalized in Rank3KUM.
    author_endorsement: "n/a"

  - title: "Cyclic Orderings of Paving Matroids"
    authors:
      - "Sean McGuinness"
    id: "arXiv:2308.12239"
    type: "article"
    location: "Electron. J. Combin. 31(4) (2024), Paper 4.9"
    relationship: "background"
    note: >-
      Establishes the conjecture for paving matroids, including the simple
      rank-three divisible case, and supplies the deletion/contiguous-insertion
      and rank-three two-gap method credited in the manuscript.
    author_endorsement: "n/a"

  - title: "Cyclic ordering of split matroids"
    authors:
      - "Kristóf Bérczi"
      - "Ádám Jánosik"
      - "Bence Mátravölgyi"
    id: "arXiv:2411.01061"
    type: "article"
    location: "Electron. J. Combin. 33 (2026), Paper 1.20"
    relationship: "background"
    note: "Related progress on cyclic orderings for a broad matroid class."
    author_endorsement: "n/a"

  - title: "Basis-exchange properties of sparse paving matroids"
    authors:
      - "Joseph E. Bonin"
    id: "arXiv:1011.1010"
    type: "article"
    location: "Adv. Appl. Math. 50 (2013), 6-15"
    relationship: "background"
    note: "Background on basis-exchange structure for sparse paving matroids."
    author_endorsement: "n/a"

  - title: "On serial symmetric exchanges of matroid bases"
    authors:
      - "Daniel Kotlar"
      - "Ran Ziv"
    id: "arXiv:1110.1826"
    type: "article"
    location: "J. Graph Theory 73(3) (2013), 296-304"
    relationship: "background"
    note: >-
      Attribution and context for serial symmetric exchange; not used as an
      unformalized theorem assumption in the Lean proof.
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://doi.org/10.5281/zenodo.22698862"
    relationship: "builds-on"
    note: >-
      Archived version-2 formalization. The present Palomar compatibility branch
      adds an independently auditable Challenge/Solution wrapper around that
      substantive proof development before the planned structural revision.
  - id: "https://doi.org/10.5281/zenodo.21813155"
    relationship: "builds-on"
    note: "Archived version-1 formalization, co-developed with the version-1 manuscript."

status:
  scope: >-
    Formalizes the divisible rank-three theorem only: rank three, finite ground
    set, |E| = 3k with k > 0, and uniform density imply a cyclic basis ordering.
    It does not formalize the van den Heuvel-Thomasse coprime case, so the paper's
    Corollary 1.3 covering every rank-three ground-set cardinality is not itself
    a fully machine-checked theorem in this repository. No representability,
    paving, simplicity, graphicness, or small-ground-set restriction is assumed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Rank3KUM.Palomar.rankThreeKUM"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "copilot"
      models: ["GPT-5.6 Sol", "Claude Opus 5"]
      framework: "interactive model interfaces with Lean 4"
      tool_setup: >-
        Human-directed AI-assisted mathematical proof development and Lean
        formalization, with Lean elaboration and kernel checking used throughout.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based; marginal cost not tracked"
        hardware: "local development machine plus hosted model services"
      prompting_notes: >-
        Human oversight selected proof directions, evaluated mathematical
        structure, requested formal checks, and reconciled the Lean development
        with the manuscript.
    - method: "other"
      models: ["GPT-6 (Astra)", "Fable 5.1"]
      framework: "model review interfaces"
      tool_setup: >-
        Version-2 critical review, formalization auditing, and expository
        refinement; these systems were not treated as trusted proof checkers.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based; marginal cost not tracked"
        hardware: "hosted model services"
      prompting_notes: "Used primarily for adversarial review and correspondence checks."
  spend_usd: "subscription-based; exact marginal cost not tracked"
  notes: >-
    The project was developed under human direction with AI assistance. All
    formal claims are checked by Lean; the submitted headline theorem is also
    separated into Palomar Challenge and Solution modules for Comparator review.

fidelity:
  divergences: >-
    No known divergence for paper Theorem 1.2, the divisible rank-three theorem.
    Paper Corollary 1.3 additionally invokes the external coprime-case theorem
    of van den Heuvel and Thomasse and is outside the fully formalized scope.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The statement-to-Lean correspondence has been audited repeatedly. Version-2
    additionally underwent AI-assisted critical review and formalization audits.
    No independent human referee report is claimed here.

alignment:
  namespace: "Rank3KUM.Palomar"
  statements:
    - source: "Theorem 1.2 (Main theorem)"
      lean: "Rank3KUM.Palomar.rankThreeKUM"
      module: "Solution"
      status: "proved"
      note: >-
        The Palomar statement reproduces the finite uniformly dense rank-three
        3k theorem. Its Solution proof is a thin wrapper around
        Rank3KUM.rankThreeKUM.

acknowledgements: >-
  Lean 4 and Mathlib provide the proof assistant and matroid infrastructure.
  GPT-5.6 Sol and Claude Opus 5 assisted the development; GPT-6 (Astra) and
  Fable 5.1 assisted version-2 review and refinement.
